<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6F3"/>
      <stop offset="1" stop-color="#E2E0DB"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD65E"/>
      <stop offset="1" stop-color="#FFAC1C"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#FFF7DA"/>
      <stop offset=".38" stop-color="#FFD65E"/>
      <stop offset="1" stop-color="#FFAC1C"/>
    </radialGradient>
    <filter id="raise" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="14" dy="14" stdDeviation="14" flood-color="#A39A88" flood-opacity=".45"/>
      <feDropShadow dx="-12" dy="-12" stdDeviation="12" flood-color="#FFFFFF" flood-opacity=".95"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#FFB224" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect class="bg" width="512" height="512" rx="112" fill="#EEEDEA"/>
  <circle cx="256" cy="256" r="156" fill="url(#disc)" filter="url(#raise)"/>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#E4E2DD" stroke-width="26"/>
  <path d="M256 132A124 124 0 1 1 139.5 298.4" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="72" fill="url(#orb)" filter="url(#glow)"/>
</svg>
